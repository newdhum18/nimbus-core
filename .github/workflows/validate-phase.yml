name: Validate Phase Branch

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate without deployment
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate source and tests
        run: npm run validate:source
      - name: Build web assets
        run: npm run build:web
      - name: Validate Cloudflare configuration and Wrangler bundle
        run: npm run check:cloudflare
      - name: Validate local Worker runtime
        run: npm run check:runtime
      - name: Confirm release resource names
        run: npm run check:config
