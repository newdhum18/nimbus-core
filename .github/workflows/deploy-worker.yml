name: Deploy Nimbus Worker

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - "wrangler.worker.jsonc"
      - "wrangler.pages.jsonc"
      - "docs/**"
      - "backup/**"
      - ".github/workflows/deploy-worker.yml"

concurrency:
  group: nimbus-worker-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-and-deploy:
    name: Validate, migrate and deploy Worker
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Show runtime versions
        run: |
          node --version
          npm --version
          npx wrangler --version

      - name: Validate source
        run: npm run validate:source

      - name: Verify clean baseline
        run: npm run baseline:verify

      - name: Apply D1 migrations with retry
        timeout-minutes: 8
        run: npm run db:apply:remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify D1 schema and migration 0012
        run: |
          npx wrangler d1 execute nimbus-core-v36-db \
            --remote \
            --config wrangler.worker.jsonc \
            --command="SELECT name FROM sqlite_master WHERE type='table' ORDER BY name; SELECT name FROM sqlite_master WHERE type='index' AND name='idx_candidate_domains_promotion'; SELECT id,source_type FROM sources WHERE id LIKE 'discovered_%' AND source_type='custom' LIMIT 1;"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker
        run: npm run deploy:worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
