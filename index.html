<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Nimbus Core V27 Core</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="stylesheet" href="/style.css" />
  <script src="/config.js"></script>
</head>
<body>
  <header>
    <div>
      <h1>Nimbus Core V27 Core</h1>
      <p>Public indexed MEGA link discovery, queue processing, health checks, cache, and dashboard.</p>
    </div>
    <button id="logoutBtn" class="hidden">Logout</button>
  </header>

  <section id="loginCard" class="card narrow">
    <h2>Login</h2>
    <input id="pinInput" type="password" placeholder="AUTH_PIN" autocomplete="current-password" />
    <button id="loginBtn">Enter</button>
    <p id="loginMsg" class="error"></p>
  </section>

  <main id="app" class="hidden">
    <section class="grid">
      <div class="card">
        <h2>Search</h2>
        <input id="query" placeholder="Optional safe keyword. Leave empty for auto patterns." />
        <div class="row">
          <button id="manualBtn">Manual Smart Search</button>
          <button id="autoBtn">Auto Scan</button>
          <button id="continueBtn">Continue Auto</button>
        </div>
        <div class="row">
          <input id="urlInput" placeholder="Scan a public page URL" />
          <button id="scanUrlBtn">Extract From URL</button>
        </div>
        <p class="muted">Core rebuild from V26+ with source engine, queue, cache, health checker, dashboard, and export.</p>
      </div>

      <div class="card">
        <h2>Controls</h2>
        <div class="row wrap">
          <button id="schemaBtn">Check DB</button>
          <button id="processQueueBtn">Process Queue</button>
          <button id="checkBtn">Check Link Health</button>
          <button id="dashboardBtn">Dashboard</button>
          <button id="refreshBtn">Refresh</button>
          <button id="exportBtn">Export CSV</button>
        </div>
      </div>
    </section>

    <section class="grid stats" id="stats"></section>

    <section class="card">
      <h2>Latest Links</h2>
      <div id="results"></div>
    </section>

    <section class="grid">
      <div class="card">
        <h2>Manual Review Sources</h2>
        <div id="manualSources"></div>
      </div>
      <div class="card">
        <h2>Queue</h2>
        <div id="queueBox"></div>
      </div>
    </section>

    <section class="card">
      <h2>Log</h2>
      <pre id="logBox"></pre>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
