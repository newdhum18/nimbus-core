<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Nimbus Core V35.2</title><link rel="stylesheet" href="style.css"></head><body>
<header><span class="eyebrow">NIMBUS CORE</span><h1>V35.2 Free-Plan Safe</h1><span class="pill">Unified Pages + Queue Pipeline</span></header>
<main>
<nav><button data-page="dashboard" class="active">Dashboard</button><button data-page="autoscan">AutoScan</button><button data-page="search">Search</button><button data-page="extract">Extract</button><button data-page="archive">Archive</button><button data-page="sources">Sources</button><button data-page="tools">Tools</button></nav>
<section id="dashboard" class="page active"><div class="card"><h2>Dashboard</h2><div id="stats" class="grid"></div><div id="run"></div><div class="actions"><button id="refresh">Refresh</button><button id="resume">Resume</button><button id="pause">Pause</button><button id="cancelRun">Cancel</button></div><pre id="dashboardLog"></pre></div></section>
<section id="autoscan" class="page"><div class="card"><h2>AutoScan</h2><p>Uses up to 80 enabled high-priority source templates from a 300-source catalog.</p><button id="startAuto">Start AutoScan</button><pre id="autoLog"></pre></div></section>
<section id="search" class="page"><div class="card"><h2>Keyword Search</h2><input id="keyword" placeholder="Keyword"><button id="startSearch">Start Search</button><pre id="searchLog"></pre></div></section>
<section id="extract" class="page"><div class="card"><h2>Extract</h2><textarea id="extractText" placeholder="Paste HTML, JSON, text, or links"></textarea><button id="extractBtn">Extract folders</button><pre id="extractLog"></pre></div></section>
<section id="archive" class="page"><div class="card"><h2>Archive</h2><div class="actions"><button id="reloadArchive">Refresh</button><a class="button" href="/api/export?format=csv" target="_blank">CSV</a><a class="button" href="/api/export?format=json" target="_blank">JSON</a></div><div id="archiveList"></div></div></section>
<section id="sources" class="page"><div class="card"><h2>Sources</h2><div class="actions"><button id="reloadSources">Refresh</button><button id="resetSources">Reset Catalog</button></div><input id="sourceSearch" placeholder="Search sources"><div id="sourceSummary"></div><div id="sourceList"></div><div class="actions"><button id="prevSources">Previous</button><span id="sourcePage"></span><button id="nextSources">Next</button></div></div></section>
<section id="tools" class="page"><div class="card"><h2>Tools</h2><input id="adminToken" type="password" placeholder="Optional ADMIN_TOKEN"><div class="actions"><button id="saveToken">Save Token</button><button id="repair">Repair DB</button><button id="diagnostics">Diagnostics</button></div><pre id="toolsLog"></pre></div></section>
</main><script src="app.js" type="module"></script></body></html>
